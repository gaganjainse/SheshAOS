[package]
name = "shesh-remote"
version = "0.1.0"
edition = "2021"

[dependencies]
russh = "0.62.6"  # >=0.60.3: RUSTSEC-2026-0153/0154 (CVE-2026-46673)
# russh-keys merged into russh as russh::keys in the 0.4x line.
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
shesh-wps = { path = "../shesh-wps" }
shesh-blockctl = { path = "../shesh-blockctl" }
thiserror = "1.0"

[dev-dependencies]
rand = "0.10"

[lints]
workspace = true
