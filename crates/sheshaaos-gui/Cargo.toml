[package]
name = "sheshaaos-gui"
version = "0.1.0"
edition = "2021"
description = "Native GUI for SheshaAOS using iced"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
iced = { version = "0.14", features = ["tokio", "canvas"] }
portable-pty = { workspace = true }
vte = "0.13"
sheshaaos-wps = { workspace = true }
sheshaaos-waveobj = { workspace = true }
sheshaaos-blockctl = { workspace = true }
sheshaaos-wconfig = { workspace = true }
tracing = { workspace = true }
sheshaaos-ai = { version = "0.1.0", path = "../sheshaaos-ai" }
sheshaaos-remote = { version = "0.1.0", path = "../sheshaaos-remote" }

[lints]
workspace = true
