[package]
name = "seshaos"
version = "0.1.0"
edition = "2021"

[dependencies]
# Keep this crate minimal: pure type definitions (machete-enforced — see the
# supply-chain CI job). Reintroduce a dependency only with the code using it.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.9"
