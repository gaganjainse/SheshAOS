[workspace]
resolver = "3"
members = [
    "crates/shesh-waveobj",
    "crates/shesh-wps",
    "crates/shesh-blockctl",
    "crates/shesh-wconfig",
    "crates/shesh-ai",
    "crates/shesh-remote",
    "crates/shesh-rpc",
    "crates/shesh-kernel",
    "crates/shesh-vault",
    "bin/shesh-cli",
]

[workspace.dependencies]
criterion = "0.5"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.32"
async-trait = "0.1"
futures = "0.3"
regex = "1"
portable-pty = "0.8"
# rusqlite uses the "bundled" feature to compile SQLite from source.
# This ensures consistent behavior across platforms without requiring
# system SQLite libraries. Trade-off: longer build times and larger binaries.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
notify = "6.1"

# Internal workspace crates
shesh-waveobj = { path = "crates/shesh-waveobj" }
shesh-wps = { path = "crates/shesh-wps" }
shesh-blockctl = { path = "crates/shesh-blockctl" }
shesh-wconfig = { path = "crates/shesh-wconfig" }
shesh-ai = { path = "crates/shesh-ai" }
shesh-remote = { path = "crates/shesh-remote" }
shesh-rpc = { path = "crates/shesh-rpc" }
shesh-kernel = { path = "crates/shesh-kernel" }
shesh-vault = { path = "crates/shesh-vault" }

[profile.release]
lto = true
strip = true
codegen-units = 1

[workspace.lints.rust]

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
