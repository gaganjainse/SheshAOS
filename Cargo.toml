[workspace]
resolver = "3"
members = [
    "crates/nexusaos-waveobj",
    "crates/nexusaos-wps",
    "crates/nexusaos-blockctl",
    "crates/nexusaos-wconfig",
    "crates/nexusaos-ai",
    "crates/nexusaos-remote",
    "crates/nexusaos-rpc",
    "crates/nexusaos-gui",
    "crates/nexusaos-kernel",
    "crates/nexusaos-vault",
    "crates/nexusaos-tui",
    "crates/nexusaos-terminal",
    "bin/nexusaos-cli",
    "tests",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.32"
async-trait = "0.1"
futures = "0.3"
regex = "1"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
notify = "6.1"

# Internal workspace crates
nexusaos-waveobj = { path = "crates/nexusaos-waveobj" }
nexusaos-wps = { path = "crates/nexusaos-wps" }
nexusaos-blockctl = { path = "crates/nexusaos-blockctl" }
nexusaos-wconfig = { path = "crates/nexusaos-wconfig" }
nexusaos-ai = { path = "crates/nexusaos-ai" }
nexusaos-remote = { path = "crates/nexusaos-remote" }
nexusaos-rpc = { path = "crates/nexusaos-rpc" }
nexusaos-gui = { path = "crates/nexusaos-gui" }
nexusaos-kernel = { path = "crates/nexusaos-kernel" }
nexusaos-vault = { path = "crates/nexusaos-vault" }
nexusaos-tui = { path = "crates/nexusaos-tui" }
nexusaos-terminal = { path = "crates/nexusaos-terminal" }

[profile.release]
lto = true
strip = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
