[workspace]
resolver = "3"
members = [
    "crates/sheshaaos-waveobj",
    "crates/sheshaaos-wps",
    "crates/sheshaaos-blockctl",
    "crates/sheshaaos-wconfig",
    "crates/sheshaaos-ai",
    "crates/sheshaaos-remote",
    "crates/sheshaaos-rpc",
    "crates/sheshaaos-gui",
    "crates/sheshaaos-kernel",
    "crates/sheshaaos-vault",
    "crates/sheshaaos-tui",
    "crates/sheshaaos-terminal",
    "bin/sheshaaos-cli",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.32"
async-trait = "0.1"
futures = "0.3"
regex = "1"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
portable-pty = "0.8"
# rusqlite uses the "bundled" feature to compile SQLite from source.
# This ensures consistent behavior across platforms without requiring
# system SQLite libraries. Trade-off: longer build times and larger binaries.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
notify = "6.1"

# Internal workspace crates
sheshaaos-waveobj = { path = "crates/sheshaaos-waveobj" }
sheshaaos-wps = { path = "crates/sheshaaos-wps" }
sheshaaos-blockctl = { path = "crates/sheshaaos-blockctl" }
sheshaaos-wconfig = { path = "crates/sheshaaos-wconfig" }
sheshaaos-ai = { path = "crates/sheshaaos-ai" }
sheshaaos-remote = { path = "crates/sheshaaos-remote" }
sheshaaos-rpc = { path = "crates/sheshaaos-rpc" }
sheshaaos-gui = { path = "crates/sheshaaos-gui" }
sheshaaos-kernel = { path = "crates/sheshaaos-kernel" }
sheshaaos-vault = { path = "crates/sheshaaos-vault" }
sheshaaos-tui = { path = "crates/sheshaaos-tui" }
sheshaaos-terminal = { path = "crates/sheshaaos-terminal" }

[profile.release]
lto = true
strip = true
codegen-units = 1

[workspace.lints.rust]

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
