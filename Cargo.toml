[workspace]

resolver = "3"
members = [
    "crates/shesh-waveobj",
    "crates/shesh-wps",
    "crates/shesh-blockctl",
    "crates/shesh-wconfig",
    "crates/shesh-ai",
    "crates/shesh-remote",
    "crates/shesh-rpc",
    "crates/shesh-kernel",
    "crates/shesh-vault",
    "bin/shesh-cli",
]
# bootstrap/ is a deliberately separate crate (AOS bootstrap realm, own lock
# + own scripts); keep it out of the main workspace.
exclude = ["bootstrap"]

[workspace.package]
license = "MIT"

[workspace.dependencies]
criterion = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.39"
async-trait = "0.1"
futures = "0.3"
regex = "1"
portable-pty = "0.9"
# rusqlite uses the "bundled" feature to compile SQLite from source.
# This ensures consistent behavior across platforms without requiring
# system SQLite libraries. Trade-off: longer build times and larger binaries.
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
notify = "8.2"

# Internal workspace crates (explicit versions: cargo-deny `wildcards = "deny"`)
shesh-waveobj = { path = "crates/shesh-waveobj", version = "0.1.0" }
shesh-wps = { path = "crates/shesh-wps", version = "0.1.0" }
shesh-blockctl = { path = "crates/shesh-blockctl", version = "0.1.0" }
shesh-wconfig = { path = "crates/shesh-wconfig", version = "0.1.0" }
shesh-ai = { path = "crates/shesh-ai", version = "0.1.0" }
shesh-remote = { path = "crates/shesh-remote", version = "0.1.0" }
shesh-rpc = { path = "crates/shesh-rpc", version = "0.1.0" }
shesh-kernel = { path = "crates/shesh-kernel", version = "0.1.0" }
shesh-vault = { path = "crates/shesh-vault", version = "0.1.0" }

[profile.release]
lto = true
strip = true
codegen-units = 1

[workspace.lints.rust]

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
