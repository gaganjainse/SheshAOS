litellm_settings:
  drop_params: true  # Drops Anthropic parameters to prevent breaking NVIDIA NIM

# NVIDIA_NIM_API_KEY is supplied via the environment at runtime
# (os.environ/NVIDIA_NIM_API_KEY). Never commit the key — set it in .env
# (gitignored) or your shell before launching.

model_list:
  - model_name: nvidia/nemotron-3-ultra-550b-a55b
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_NIM_API_KEY
      api_base: https://integrate.api.nvidia.com/v1

