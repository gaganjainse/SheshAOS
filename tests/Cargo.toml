[package]
name = "shesh-tests"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[[test]]
name = "integration"
path = "integration/cli_kernel_tools_flow.rs"

[[test]]
name = "visual"
path = "visual/terminal_rendering.rs"

[[test]]
name = "pty"
path = "pty/pty_integration.rs"

[[bench]]
name = "performance"
path = "benchmarks/performance.rs"
harness = false

[[test]]
name = "ai_integration"
path = "ai_integration/ai_provider.rs"

[dependencies]
shesh-gui = { path = "../crates/shesh-gui" }
shesh-ai = { path = "../crates/shesh-ai" }
shesh-kernel = { path = "../crates/shesh-kernel" }
shesh-terminal = { path = "../crates/shesh-terminal" }
shesh-remote = { path = "../crates/shesh-remote" }
shesh-wps = { path = "../crates/shesh-wps" }
shesh-waveobj = { path = "../crates/shesh-waveobj" }
shesh-blockctl = { path = "../crates/shesh-blockctl" }
shesh-wconfig = { path = "../crates/shesh-wconfig" }

# Test dependencies
async-trait = "0.1"
vte = "0.13"
tokio = { version = "1", features = ["full", "test-util"] }
criterion = "0.5"
tempfile = "3.8"
mockito = "1.2"
image = "0.25"
futures = "0.3"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
portable-pty = "0.8"
russh = "0.45"
iced = { version = "0.14", features = ["canvas"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"