[package]
name = "shesh-kernel-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Standalone crate — opt out of the parent workspace (fuzz targets link
# libfuzzer with sanitizer flags that must not leak into the main build).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
shesh-kernel = { path = "../crates/shesh-kernel" }

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false

[[bin]]
name = "event_json"
path = "fuzz_targets/event_json.rs"
test = false
doc = false
