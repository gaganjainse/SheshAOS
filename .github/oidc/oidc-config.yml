oidc:
  federation:
    - provider: aws
      audience: https://sheshaaos.aws.example.com
      subject_claim: sub
      issuer: https://token.actions.githubusercontent.com
      authorization_url: https://sheshaaos.aws.example.com/login
      token_url: https://sheshaaos.aws.example.com/token
    - provider: azure
      audience: https://sheshaaos.azure.example.com
      subject_claim: sub
      issuer: https://token.actions.githubusercontent.com
      authorization_url: https://sheshaaos.azure.example.com/login
      token_url: https://sheshaaos.azure.example.com/token
    - provider: gcp
      audience: https://sheshaaos-gcp.example.com
      subject_claim: sub
      issuer: https://token.actions.githubusercontent.com
      authorization_url: https://sheshaaos-gcp.example.com/login
      token_url: https://sheshaaos-gcp.example.com/token
  roles:
    - name: deploy-role
      provider: aws
      conditions:
        - claim: repository
          equals: SheshaAOS/SheshaAOS
        - claim: environment
          equals: production
        - claim: actor
          pattern: "^sheshaaos-bot$"
      permissions:
        - sts:AssumeRole
      session_duration_seconds: 3600
    - name: staging-deploy-role
      provider: aws
      conditions:
        - claim: repository
          equals: SheshaAOS/SheshaAOS
        - claim: environment
          equals: staging
        - claim: actor
          pattern: "^sheshaaos-bot$"
      permissions:
        - sts:AssumeRole
      session_duration_seconds: 3600
    - name: azure-deploy-role
      provider: azure
      conditions:
        - claim: repository
          equals: SheshaAOS/SheshaAOS
        - claim: environment
          equals: production
      permissions:
        - Azure.Resources.Deploy
      session_duration_seconds: 3600
    - name: gcp-deploy-role
      provider: gcp
      conditions:
        - claim: repository
          equals: SheshaAOS/SheshaAOS
        - claim: environment
          equals: production
      permissions:
        - roles/editor
      session_duration_seconds: 3600
  trust_policies:
    - issuer: https://token.actions.githubusercontent.com
      audiences:
        - https://sheshaaos.aws.example.com
        - https://sheshaaos.azure.example.com
        - https://sheshaaos-gcp.example.com
      condition:
        - claim: repository
          equals: SheshaAOS/SheshaAOS
        - claim: ref
          pattern: "^refs/heads/(main|master)$"
    - issuer: https://token.actions.githubusercontent.com
      audiences:
        - https://sheshaaos.aws.example.com
        - https://sheshaaos.azure.example.com
        - https://sheshaaos-gcp.example.com
      condition:
        - claim: repository
          equals: SheshaAOS/SheshaAOS
        - claim: environment
          equals: staging
  token_exchange:
    enabled: true
    grant_type: urn:ietf:params:oauth:grant-type:token-exchange
    subject_token_type: urn:ietf:params:oauth:token-type:jwt
    requested_token_type: urn:ietf:params:oauth:token-type:access_token
