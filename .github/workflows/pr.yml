name: PR Checks

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # base_ref is attacker-controllable; route it through env, never inline
      # into a run: shell (zizmor template-injection, fixed 2026-08-14).
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v7.0.1
        with:
          # Full history: the size, conflict, and breaking-change steps all diff
          # against the base. On a shallow clone the base ref is absent, the
          # merge base cannot be computed, and every one of those gates passes
          # while inspecting nothing.
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (pinned snapshot 2026-08-13; quarterly review moves it)
        with:
          components: rustfmt, clippy

      - name: Check PR title follows convention
        env:
          # Title passes through env, never inline — PR titles are attacker
          # input (actionlint expression injection, fixed 2026-08-12).
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # `deps` and `build` are included because this repository's own
          # dependabot.yml emits `deps:` — the gate rejected every dependency
          # PR it opened. `revert` is Conventional Commits' own type.
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|refactor|test|chore|ci|perf|style|deps|build|revert)(\(.+\))?!?: ]]; then
            echo "::error::PR title must follow conventional commits: type(scope): description"
            echo "Example: feat(kernel): add task deduplication"
            exit 1
          fi

      - name: Check PR size
        run: |
          LINES=$(git diff --stat "origin/$BASE_REF" | tail -1 | awk '{print $4}')
          if [ "$LINES" -gt 500 ]; then
            echo "::warning::PR is large ($LINES lines). Consider splitting into smaller PRs."
          fi

      - name: Verify no merge conflicts
        run: |
          # The checkout uses fetch-depth: 0, so the base ref and the merge
          # base are always present. Read the CONFLICT marker rather than the
          # exit code, which also means "no merge base" and used to be reported
          # as a conflict that did not exist.
          base=$(git merge-base HEAD "origin/$BASE_REF")
          echo "merge base: $base"
          if git merge-tree --write-tree HEAD "origin/$BASE_REF" 2>&1 \
             | grep -q "^CONFLICT"; then
            echo "::error::PR has merge conflicts"
            exit 1
          fi
          echo "No merge conflicts."

      - name: Check for breaking changes
        run: |
          if git diff --name-only "origin/$BASE_REF" | grep -E "^crates/.*/src/lib.rs$|^Cargo.toml$"; then
            echo "::warning::PR modifies crate lib.rs or Cargo.toml - may be a breaking change"
          fi

      - name: Run fmt check
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check test coverage
        run: |
          TOTAL=$(cargo test --workspace -- --list 2>/dev/null | grep -c ': test$')
          if [ -n "$TOTAL" ] && [ "$TOTAL" -lt 100 ]; then
            echo "::warning::Test count ($TOTAL) is below threshold (100). Add more tests."
          fi

  auto-merge:
    name: Auto-merge Dependencies
    runs-on: ubuntu-24.04
    needs: pr-validation
    permissions:
      contents: write
      pull-requests: write
    if: github.event.pull_request.draft == false && github.event.sender.type == 'Bot' && contains(github.event.pull_request.labels.*.name, 'dependencies')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v7.0.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash'
            })
