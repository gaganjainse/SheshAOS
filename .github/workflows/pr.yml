name: PR Checks

on:
  pull_request:
    branches: [main, master]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check PR title follows convention
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ ! "$TITLE" =~ ^(feat|fix|docs|refactor|test|chore|ci|perf|style)(\(.+\))?: ]]; then
            echo "::error::PR title must follow conventional commits: type(scope): description"
            echo "Example: feat(kernel): add task deduplication"
            exit 1
          fi

      - name: Check PR size
        run: |
          LINES=$(git diff --stat origin/${{ github.base_ref }} | tail -1 | awk '{print $4}')
          if [ "$LINES" -gt 500 ]; then
            echo "::warning::PR is large ($LINES lines). Consider splitting into smaller PRs."
          fi

      - name: Verify no merge conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          if ! git merge-tree --write-tree HEAD origin/${{ github.base_ref }} > /dev/null 2>&1; then
            echo "::error::PR has merge conflicts"
            exit 1
          fi

      - name: Check for breaking changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }} | grep -E "^crates/.*/src/lib.rs$|^Cargo.toml$"; then
            echo "::warning::PR modifies crate lib.rs or Cargo.toml - may be a breaking change"
          fi

      - name: Run fmt check
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check test coverage
        run: |
          TOTAL=$(cargo test --workspace 2>&1 | grep "test result:" | awk '{print $4}' | sed 's/;//g' | tr '\n' '+' | sed 's/+$//' | bc 2>/dev/null || echo "0")
          if [ "$TOTAL" -lt 100 ]; then
            echo "::warning::Test count ($TOTAL) is below threshold (100). Add more tests."
          fi

  auto-merge:
    name: Auto-merge Dependencies
    runs-on: ubuntu-latest
    needs: pr-validation
    if: github.event.pull_request.draft == false && github.actor == 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'dependencies')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash'
            })
