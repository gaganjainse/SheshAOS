name: PR Checks

on:
  pull_request:
    branches: [main, master]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # base_ref is attacker-controllable; route it through env, never inline
      # into a run: shell (zizmor template-injection, fixed 2026-08-14).
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (pinned snapshot 2026-08-13; quarterly review moves it)
        with:
          components: rustfmt, clippy

      - name: Check PR title follows convention
        env:
          # Title passes through env, never inline — PR titles are attacker
          # input (actionlint expression injection, fixed 2026-08-12).
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|refactor|test|chore|ci|perf|style)(\(.+\))?: ]]; then
            echo "::error::PR title must follow conventional commits: type(scope): description"
            echo "Example: feat(kernel): add task deduplication"
            exit 1
          fi

      - name: Check PR size
        run: |
          LINES=$(git diff --stat "origin/$BASE_REF" | tail -1 | awk '{print $4}')
          if [ "$LINES" -gt 500 ]; then
            echo "::warning::PR is large ($LINES lines). Consider splitting into smaller PRs."
          fi

      - name: Verify no merge conflicts
        run: |
          git fetch origin "$BASE_REF"
          if ! git merge-tree --write-tree HEAD "origin/$BASE_REF" > /dev/null 2>&1; then
            echo "::error::PR has merge conflicts"
            exit 1
          fi

      - name: Check for breaking changes
        run: |
          if git diff --name-only "origin/$BASE_REF" | grep -E "^crates/.*/src/lib.rs$|^Cargo.toml$"; then
            echo "::warning::PR modifies crate lib.rs or Cargo.toml - may be a breaking change"
          fi

      - name: Run fmt check
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check test coverage
        run: |
          TOTAL=$(cargo test --workspace -- --list 2>/dev/null | grep -c ': test$')
          if [ -n "$TOTAL" ] && [ "$TOTAL" -lt 100 ]; then
            echo "::warning::Test count ($TOTAL) is below threshold (100). Add more tests."
          fi

  auto-merge:
    name: Auto-merge Dependencies
    runs-on: ubuntu-latest
    needs: pr-validation
    permissions:
      contents: write
      pull-requests: write
    if: github.event.pull_request.draft == false && github.event.sender.type == 'Bot' && contains(github.event.pull_request.labels.*.name, 'dependencies')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash'
            })
