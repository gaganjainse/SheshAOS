name: Fuzz (compile gate)

on:
  schedule:
    - cron: '30 3 * * 0' # weekly: keep fuzz targets compiling as the API evolves
  workflow_dispatch:

permissions: read-all

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly (pinned action)
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Build all fuzz targets (compile gate — no long-running fuzzing here)
        working-directory: fuzz
        run: cargo fuzz build
