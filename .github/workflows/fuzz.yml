name: Fuzz (compile gate)

on:
  schedule:
    - cron: '30 3 * * 0' # weekly: keep fuzz targets compiling as the API evolves
  workflow_dispatch:

permissions: read-all

jobs:
  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Build all fuzz targets (compile gate — no long-running fuzzing here)
        working-directory: fuzz
        run: cargo fuzz build
