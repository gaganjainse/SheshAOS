name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check for unwrap/expect in production code
        run: |
          if grep -rn "\.unwrap()\|\.expect(" crates/ bin/ src/ --include="*.rs" | grep -v "^#\|tests\|#[cfg(test)]"; then
            echo "::error::Found unwrap/expect in production code"
            exit 1
          fi

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --lib --workspace

      - name: Run integration tests
        run: cargo test --workspace --tests

      - name: Run doc tests
        run: cargo test --workspace --doc

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build workspace
        run: cargo build --workspace

      - name: Build release
        run: cargo build --release --workspace

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  architecture:
    name: Architecture Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify no orphaned src/ directory
        run: |
          if [ -d "src" ]; then
            echo "::error::Orphaned src/ directory still exists"
            exit 1
          fi

      - name: Verify architecture artifact exists
        run: |
          if [ ! -f ".kilo/plans/architecture.md" ]; then
            echo "::error::Missing architecture.md artifact"
            exit 1
          fi

      - name: Validate Mermaid diagrams
        run: |
          if ! grep -q "```mermaid" .kilo/plans/architecture.md; then
            echo "::error::No Mermaid diagrams found in architecture.md"
            exit 1
          fi
