name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Default-deny token: jobs that need more (e.g. rustsec/audit-check) opt in
# explicitly at job level. Anything else gets a read-only GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      # unwrap_used/expect_used/panic are enforced tool-natively: they are
      # workspace lints (workspace Cargo.toml, every crate opts in via
      # [lints] workspace = true) and `-D warnings` promotes them to errors,
      # while clippy.toml's allow-*-in-tests keeps test code idiomatic.
      # A grep for ".unwrap()" cannot track #[cfg(test)] scope and produced
      # only false positives, so it was removed, not loosened.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Shell scripts: syntax (bash -n) + static analysis (shellcheck) +
      # formatting (shfmt, -i 4 -ci matches the repo's established style).
      # Gate added 2026-08-12; it immediately caught sesha-bootstrap.sh's
      # multi-line brace expansion, which bash could not parse at all.
      - name: Lint shell scripts (bash -n, shellcheck, shfmt)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck shfmt
          set -e
          mapfile -t SHELLS < <(git ls-files '*.sh' '*.bash')
          echo "shell files: ${SHELLS[*]}"
          for f in "${SHELLS[@]}"; do bash -n "$f"; done
          shellcheck "${SHELLS[@]}"
          shfmt -d -i 4 -ci "${SHELLS[@]}"

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --lib --workspace

      - name: Run integration tests
        run: cargo test --workspace --tests

      - name: Run doc tests
        run: cargo test --workspace --doc

      - name: Report test count
        run: |
          TOTAL=$(cargo test --workspace 2>&1 | grep -oP '\d+(?= passed)' | paste -sd+ | bc)
          echo "Total tests: $TOTAL"
          if [ "$TOTAL" -lt 850 ]; then
            echo "::error::Test count ($TOTAL) dropped below 850. Measured 872 on 2026-08-12 post-excision (ADR-0018); the floor absorbs refactors, raise it when adding tests."
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build workspace
        run: cargo build --workspace

      - name: Build release
        run: cargo build --release --workspace

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    # rustsec/audit-check publishes its report as a check run, which the
    # default read-only GITHUB_TOKEN cannot do.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  architecture:
    name: Architecture Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify architecture artifact exists
        run: |
          if [ ! -f ".kilo/plans/architecture.md" ]; then
            echo "::error::Missing architecture.md artifact"
            exit 1
          fi

      - name: Validate Mermaid diagrams
        # NOTE: the pattern must be single-quoted — double quotes let bash
        # treat the backticks as command substitution and the step aborts
        # with "unexpected EOF" regardless of the file's contents.
        run: |
          if ! grep -q '^```mermaid' .kilo/plans/architecture.md; then
            echo "::error::No Mermaid diagrams found in architecture.md"
            exit 1
          fi
