name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # shesh-terminal's build.rs compiles zig_src/vt100_expert.zig; keep this
  # pin in sync with the documented local toolchain (zig 0.15.2).
  ZIG_VERSION: "0.15.2"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Zig (required by shesh-terminal build script)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check for unwrap/expect in production code
        run: |
          if grep -rn "\.unwrap()\|\.expect(" crates/ bin/ --include="*.rs" | grep -v "tests\|#\[cfg(test)\]\|#\[allow" | grep -v "^.*//.*unwrap\|//.*expect"; then
            echo "::error::Found unwrap/expect in production code"
            exit 1
          fi

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Zig (required by shesh-terminal build script)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --lib --workspace

      - name: Run integration tests
        run: cargo test --workspace --tests

      - name: Run doc tests
        run: cargo test --workspace --doc

      - name: Report test count
        run: |
          TOTAL=$(cargo test --workspace 2>&1 | grep -oP '\d+(?= passed)' | paste -sd+ | bc)
          echo "Total tests: $TOTAL"
          if [ "$TOTAL" -lt 900 ]; then
            echo "::error::Test count ($TOTAL) dropped below 900. Check for accidental test deletions."
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Zig (required by shesh-terminal build script)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build workspace
        run: cargo build --workspace

      - name: Build release
        run: cargo build --release --workspace

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  architecture:
    name: Architecture Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify architecture artifact exists
        run: |
          if [ ! -f ".kilo/plans/architecture.md" ]; then
            echo "::error::Missing architecture.md artifact"
            exit 1
          fi

      - name: Validate Mermaid diagrams
        # NOTE: the pattern must be single-quoted — double quotes let bash
        # treat the backticks as command substitution and the step aborts
        # with "unexpected EOF" regardless of the file's contents.
        run: |
          if ! grep -q '^```mermaid' .kilo/plans/architecture.md; then
            echo "::error::No Mermaid diagrams found in architecture.md"
            exit 1
          fi
