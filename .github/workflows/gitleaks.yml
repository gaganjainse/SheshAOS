# gitleaks — secret scanning on every push + PR (full history).
# Catches keys that GitHub's built-in secret scanning misses (e.g. nvapi-*).
# SHA-pinned per fleet policy.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # full history — secrets may live in old commits

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        # GITHUB_TOKEN intentionally omitted: the gate fails the job on findings
        # (no PR comment needed) and avoids passing credentials to the action.
