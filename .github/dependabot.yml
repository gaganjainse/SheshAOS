version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    reviewers:
      - sheshaaos/maintainers
    labels:
      - dependencies
      - cargo
    commit-message:
      prefix: deps
      include: scope
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tokio"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "serde"
        update-types: ["version-update:semver-minor"]
    groups:
      runtime-dependencies:
        patterns:
          - "tokio"
          - "serde"
          - "serde_json"
          - "anyhow"
          - "thiserror"
          - "tracing"
          - "tracing-subscriber"
          - "reqwest"
          - "uuid"
          - "chrono"
      development-dependencies:
        patterns:
          - "cargo-audit"
          - "cargo-clippy"
          - "cargo-fmt"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    reviewers:
      - sheshaaos/maintainers
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
