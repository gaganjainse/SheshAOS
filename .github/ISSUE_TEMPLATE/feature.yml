name: Feature
description: A capability that does not exist yet
labels: ["type:feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The need this serves. Not the solution.
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What to build. Name the tool or interface it needs.
    validations: {required: true}
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A checklist a reviewer can verify.
      value: |
        - [ ] 
        - [ ] Tests cover the new behaviour
        - [ ] Documentation updated
    validations: {required: true}
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["p0 blocker", "p1 next", "p2 planned", "p3 someday"]
    validations: {required: true}
